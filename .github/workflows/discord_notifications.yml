name: Alertas Discord

on:
  workflow_run:
    workflows: ["CI", "CD"]
    types:
      - completed

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Definir etapa
        id: etapa
        run: |
          if [ "${{ github.event.workflow_run.name }}" = "CI" ]; then
            echo "label=Testes" >> "$GITHUB_OUTPUT"
            echo "emoji=🧪" >> "$GITHUB_OUTPUT"
          else
            echo "label=Build & Deploy" >> "$GITHUB_OUTPUT"
            echo  >> "$GITHUB_OUTPUT"
          fi

      - name: Enviar alerta no Discord (Sucesso)
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \"${{ steps.etapa.outputs.emoji }} **Etapa de ${{ steps.etapa.outputs.label }} concluída com sucesso!**\n**Repositório:** ${{ github.repository }}\n**Branch:** ${{ github.event.workflow_run.head_branch }}\n**Commit:** ${{ github.event.workflow_run.head_sha }}\"}" \
               "$DISCORD_WEBHOOK"

      - name: Enviar alerta no Discord (Falha)
        if: ${{ github.event.workflow_run.conclusion == 'failure' }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\": \" **Falha na etapa de ${{ steps.etapa.outputs.label }}!**\n**Repositório:** ${{ github.repository }}\n**Branch:** ${{ github.event.workflow_run.head_branch }}\n**Commit:** ${{ github.event.workflow_run.head_sha }}\"}" \
               "$DISCORD_WEBHOOK"